name: Bug report
description: A command failed or produced broken output
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command and error
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Output of `judge.py doctor` and `judge.py version`
      render: text
    validations:
      required: true
